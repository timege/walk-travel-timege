name: Build Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: python3 .github/scripts/unpack_android.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore upload keystore
        env:
          WTT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.WTT_UPLOAD_KEYSTORE_BASE64 }}
          WTT_UPLOAD_KEY_PASSWORD: ${{ secrets.WTT_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WTT_UPLOAD_KEYSTORE_BASE64"
          test -n "$WTT_UPLOAD_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/wtt-signing"
          printf '%s' "$WTT_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wtt-signing/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/wtt-signing/upload.jks" -storepass "$WTT_UPLOAD_KEY_PASSWORD" -alias walktravel >/dev/null
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/wtt-signing/upload.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$WTT_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=walktravel" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$WTT_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify production source
        working-directory: android-src
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          grep -q 'versionCode = 46' app/build.gradle.kts
          grep -q 'create("release")' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Build signed release AAB
        working-directory: android-src
        shell: bash
        run: gradle --no-daemon :app:bundleRelease --console=plain

      - name: Verify AAB exists
        shell: bash
        run: |
          set -euo pipefail
          test -s android-src/app/build/outputs/bundle/release/app-release.aab
          ls -lh android-src/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: walk-travel-timege-1.0.0-google-play-aab
          path: android-src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
