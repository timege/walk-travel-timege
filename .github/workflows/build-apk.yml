name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q walk-travel-timege-source.zip -d android-src
          test -f android-src/settings.gradle.kts
          test -f android-src/app/build.gradle.kts

      - name: Apply POI clear-all feature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path("android-src/app/src/main/java/com/lifeinmist/app/DiscoveryStore.kt")
          store = store_path.read_text(encoding="utf-8")
          if "fun clearAllPlaces()" not in store:
              needle = '    @Synchronized fun openedAt(id: String): Long = found.optLong(id, 0)\n'
              insert = needle + '''
          
              @Synchronized fun clearAllPlaces() {
                  catalog = emptyList()
                  found = JSONObject()
                  persist()
              }
          '''
              if needle not in store:
                  raise SystemExit("DiscoveryStore insertion point not found")
              store = store.replace(needle, insert, 1)
              store_path.write_text(store, encoding="utf-8")

          ui_path = Path("android-src/app/src/main/java/com/lifeinmist/app/DiscoveryUi.kt")
          ui = ui_path.read_text(encoding="utf-8")
          if 'tr("Remove all places", "Удалить все интересные места")' not in ui:
              needle = '        actionButton(content, tr("Import places", "Загрузить подборку")) { dialog.dismiss(); importFile() }\n'
              insert = needle + '''        if (places.isNotEmpty()) {
              actionButton(content, tr("Remove all places", "Удалить все интересные места")) {
                  dialog.dismiss()
                  confirmClearAll()
              }
          }
          '''
              if needle not in ui:
                  raise SystemExit("DiscoveryUi button insertion point not found")
              ui = ui.replace(needle, insert, 1)

              method_marker = '    fun showCard(place: DiscoveryPlace) {\n'
              method = '''    private fun confirmClearAll() {
              val dialog = AlertDialog.Builder(activity)
                  .setCustomTitle(titleView(tr("Remove all places?", "Удалить все интересные места?")))
                  .setMessage(tr(
                      "This removes all imported places and their discovery history. Walks, explored map data and GPX routes will not be affected.",
                      "Будут удалены все интересные места и история их открытий. Прогулки, открытая карта и GPX-маршруты останутся без изменений."
                  ))
                  .setNegativeButton(tr("Cancel", "Отмена"), null)
                  .setPositiveButton(tr("Remove", "Удалить")) { _, _ ->
                      store.clearAllPlaces()
                      refresh()
                      Toast.makeText(activity, tr("All places removed", "Все интересные места удалены"), Toast.LENGTH_SHORT).show()
                  }
                  .create()
              dialog.show()
              roundCard(dialog)
              tintNegativeButton(dialog)
          }

          '''
              if method_marker not in ui:
                  raise SystemExit("DiscoveryUi method insertion point not found")
              ui = ui.replace(method_marker, method + method_marker, 1)
              ui_path.write_text(ui, encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK and install API 37
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore permanent Android signing key
        env:
          WTT_DEBUG_KEYSTORE_BASE64: ${{ secrets.WTT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$WTT_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret WTT_DEBUG_KEYSTORE_BASE64"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$WTT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: android-src
        shell: bash
        run: |
          set +e

          gradle --no-daemon :app:assembleDebug --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== BUILD ERROR =========="
            grep -Ei -B 8 -A 25 "what went wrong|execution failed|could not|caused by|error:|^e:|requires.*compileSdk" build.log | tail -160 || true
            echo "================================="
          fi

          exit "$STATUS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: walk-travel-timege-debug-apk
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
