name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q walk-travel-timege-source.zip -d android-src
          test -f android-src/settings.gradle.kts
          test -f android-src/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore permanent Android signing key
        env:
          WTT_DEBUG_KEYSTORE_BASE64: ${{ secrets.WTT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$WTT_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret WTT_DEBUG_KEYSTORE_BASE64"
            echo "Add it in Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$WTT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: android-src
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== BUILD ERROR =========="
            grep -Ei -B 8 -A 20 "what went wrong|execution failed|could not|caused by|error:|^e:|requires.*compileSdk" build.log | tail -120 || true
            echo "================================="
          fi
          exit "$STATUS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: walk-travel-timege-debug-apk
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
